name: blocktivity-tx

on:
  schedule:
    # Hourly, off the top of the hour. GitHub cron is best-effort and may be
    # delayed a few minutes; the 24h freshness budget leaves plenty of headroom.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocktivity-tx
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Query Kibana and write docs/tx-daily.json
        run: node scripts/blocktivity-tx.mjs

      - name: Publish data branch (single commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          git init -q -b gh-pages
          git config user.name  "blocktivity-bot"
          git config user.email "blocktivity-bot@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -q -m "tx-daily $(date -u +%FT%TZ)"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
