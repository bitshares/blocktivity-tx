name: blocktivity-tx

on:
  schedule:
    # Hourly, off the top of the hour. GitHub cron is best-effort and may be
    # delayed a few minutes; the 24h freshness budget leaves plenty of headroom.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocktivity-tx
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Query Kibana and write docs/tx-daily.json
        run: node scripts/blocktivity-tx.mjs

      - name: Commit refreshed payload
        run: |
          git config user.name  "blocktivity-bot"
          git config user.email "blocktivity-bot@users.noreply.github.com"
          git add docs/tx-daily.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "tx-daily $(date -u +%FT%TZ)"
            git push
          fi
